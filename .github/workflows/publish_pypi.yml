name: Publish package to PyPI
on:
  push:
    tags:
      # See https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#filter-pattern-cheat-sheet
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+[a-c][0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+alpha[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+beta[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+rc[0-9]+"

permissions: {}

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-24.04
    environment: pypi

    permissions:
      # Required for trusted publishing on PyPI
      # see https://docs.pypi.org/trusted-publishers/
      id-token: write
      # Required for creating GitHub releases
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Build package
        run: |
          python -m pip install hatch
          python -m hatch build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

      - name: Create or update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists; uploading build artifacts to it"
            gh release upload "${GITHUB_REF_NAME}" ./dist/* --clobber
          else
            echo "No existing release for ${GITHUB_REF_NAME}; creating one with auto-generated notes"
            gh release create "${GITHUB_REF_NAME}" ./dist/* --generate-notes
          fi
