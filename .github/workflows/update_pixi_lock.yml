name: Update pixi.lock

permissions: {}

on:
  workflow_dispatch:
  # FIXME: Enable schedule
  # schedule:
  #   - cron: 0 5 1 * *

jobs:

  pixi-update:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write       # Needed to make commits
      pull-requests: write  # Needed to write a new PR

    steps:

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: true  # Needed to make commits

      - uses: prefix-dev/setup-pixi@92815284c57faa15cd896c4d5cfb2d59f32dc43d # v0.8.3
        with:
          run-install: false

      - name: Update lockfiles
        run: |
          set -o pipefail
          pixi update --json | pixi exec pixi-diff-to-markdown >> diff.md

      # NOTE: this action should always run from the `main` branch
      - run: |
          git config user.email "pixi-update-lock@example.org"
          git config user.name "pixi-update-lock bot"
          git switch "$BRANCH_NAME" || git switch -c "$BRANCH_NAME"
          git add pixi.lock
          git commit -m 'Update pixi.lock'
          git push --set-upstream origin "$BRANCH_NAME" --force
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH_NAME: "update-pixi-lock"

      # Create dedicated label for the target version
      - run: gh label create "pixi" --force
        env:
          GH_TOKEN: ${{ github.token }}

      # Check whether the same PR already exists, so that we do not recreate it
      - run: |
          echo number=$(gh pr list --label "pixi" --json number --jq '.[].number' | wc -l) >> $GITHUB_OUTPUT
        id: existing-issue
        env:
          GH_TOKEN: ${{ github.token }}

      - run: gh pr create --title "Update pixi.lock" --body-file diff.md --base main --head update-pixi-lock --label pixi --draft
        if: ${{ steps.existing-issue.outputs.number == 0 }}
        env:
          GH_TOKEN: ${{ github.token }}

      - run: echo "There is already an existing 'pixi' PR. Skip creating a new one."
        if: ${{ steps.existing-issue.outputs.number != 0 }}
