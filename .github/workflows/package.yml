name: Precommit, Ruff and Mypy (soft)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions: {}

jobs:

  package:
    name: "Precommit, Ruff and Mypy (soft)"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Run pre-commit (fail upon errors)
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff check (do not fail for errors)
        continue-on-error: true
        run: ruff check fractal_tasks_core

      - name: Install ty
        run: pip install ty

      - name: Run ty (do not fail for errors)
        continue-on-error: true
        run: ty check fractal_tasks_core
